<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FUMOCLICK</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/wei9htlessness/FUMOCLICK/main/favicon.ico">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* --- Базовые стили и сброс --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            min-width: 100vw;
            min-height: 100vh;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-family: Arial, Helvetica, sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* --- Экран загрузки --- */
        #assetCache {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--tg-theme-bg-color, #fff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity .5s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            border: 5px solid rgba(128, 128, 128, .2);
            border-top: 5px solid var(--tg-theme-text-color, #000);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }

        #loadingText {
            font-size: 18px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #000);
        }

        /* --- Игровая зона --- */
        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            opacity: 0;
            transition: opacity .5s ease;
            margin-top: -135px;
        }

        .game.visible {
            opacity: 1;
        }

        .counter-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: counterFloat 2.1s ease-in-out infinite;
            z-index: 25;
        }

        .counter-wrapper.pop {
            animation: counterFloat 2.1s ease-in-out infinite, counterPop .18s ease;
        }

        #counter {
            display: flex;
                justify-content: center;
                align-items: center;
                gap: 3px;
        }

        .digit-img {
            height: 72px;
            width: auto;
            display: block;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .boost-indicators {
            position: absolute;
            top: 150%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: -20px;
            opacity: 0;
            transition: opacity .3s ease;
            z-index: 30;
            pointer-events: none;
        }

        .boost-indicators.active {
            opacity: 1;
        }

        .boost-indicator-img {
            width: 70px;
            height: auto;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .cursor-indicator {
            width: 23px;
        }

        .x2-indicator,
        .cursor-indicator {
            animation: x2Pulse .3s ease-in-out infinite alternate;
        }

        @keyframes x2Pulse {
            0% { transform: scale(.8); }
            100% { transform: scale(1.2); }
        }

        @keyframes counterFloat {
            0%, 100% { transform: translateY(-7px); }
            50% { transform: translateY(7px); }
        }

        @keyframes counterPop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.12); }
        }

        #clickArea {
            margin-top: 20px;
            animation: idle 3.5s ease-in-out infinite;
            transform-origin: center bottom;
            -webkit-touch-callout: none;
            touch-action: none;
            position: relative;
            z-index: 10;
        }

        #clickImage {
            height: 60vh;
            width: auto;
            display: block;
            pointer-events: none;
            transform: scale(1);
            transition: transform .15s ease-out;
            -webkit-user-drag: none;
            transform-origin: center bottom;
        }

        @keyframes idle {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        /* --- Бонус Monster Energy --- */
        .boost-container {
            position: absolute;
            width: 150px;
            height: 150px;
            z-index: 1000;
            touch-action: none;
        }

        .boost-spring {
            width: 100%;
            height: 100%;
        }

        .boost-spring.spawning {
            animation: boostSpawn 1s ease-out forwards;
        }

        .boost-spring.despawning {
            animation: boostDespawn .15s ease-in forwards;
            pointer-events: none;
        }

        .boost-sway {
            width: 100%;
            height: 100%;
            animation: boostSway 2s ease-in-out infinite;
        }

        .boost-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: boostPulse .25s ease-in-out infinite alternate;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        @keyframes boostSpawn {
            0% { transform: scale(0); }
            40% { transform: scale(1.35); }
            60% { transform: scale(.85); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes boostDespawn {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: .8; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes boostSway {
            0%, 100% { transform: translateX(0) rotate(-6deg); }
            50% { transform: translateX(15px) rotate(6deg); }
        }

        @keyframes boostPulse {
            0% { transform: scale(.85); }
            100% { transform: scale(1.15); }
        }

        /* --- Нижние кнопки UI --- */
        .ui-container {
            position: fixed;
            bottom: 45px;
            left: calc(50% + 2px);
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            gap: 0;
            z-index: 100;
        }

        .ui-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 107px;
            margin-left: -15px;
        }

        .ui-btn-wrapper {
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: transform .1s ease;
        }

        .ui-btn-img {
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .ui-btn-small { width: 65px; height: 49px; }
        .ui-btn-large { width: 148px; height: 107px; margin-left: 15px; }

        .ui-btn-achv { animation: uiFloat1 3s ease-in-out infinite; }
        .ui-btn-settings { animation: uiFloat2 3.5s ease-in-out infinite; }
        .ui-btn-shop { animation: uiFloat3 4s ease-in-out infinite; }

        @keyframes uiFloat1 { 0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); } 50% { transform: translate(-3px, -3px) scale(var(--press-scale)); } }
        @keyframes uiFloat2 { 0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); } 50% { transform: translate(3px, -3px) scale(var(--press-scale)); } }
        @keyframes uiFloat3 { 0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); } 50% { transform: translate(-3px, 3px) scale(var(--press-scale)); } }

        /* --- Модальные окна --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--tg-theme-bg-color, #fff);
            z-index: 10000;
            display: none;
            opacity: 0;
            transition: opacity .3s ease;
        }

        .modal.active {
            display: block;
            opacity: 1;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            max-height: 80%;
            overflow-y: auto;
            padding: 20px;
            text-align: center;
        }

        .modal-close-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: transform .18s ease-out;
            animation: exitFloat 3.5s ease-in-out infinite;
        }

        .stats-modal-content {
            width: 92%;
            max-width: 380px;
            padding: 24px 18px 24px;
            text-align: center;
            background: rgba(255,255,255,0.96);
            box-shadow: 0 20px 50px rgba(0,0,0,0.24);
            border-radius: 22px;
            position: relative;
            max-height: 95vh;
            overflow-y: auto;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 18px;
            background: rgba(250,250,250,0.96);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
            transition: transform .18s ease, background .18s ease;
        }

        .stats-row:active {
            transform: scale(0.98);
        }

        .stats-label,
        .stats-value,
        .stats-row {
            text-transform: uppercase;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .stats-label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            letter-spacing: .5px;
            text-align: left;
        }

        .stats-value {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            text-align: right;
            line-height: 1.2;
        }

        .stats-close-wrapper {
            position: static;
            width: 34px;
            height: 34px;
            margin-left: auto;
            animation: exitFloat 3.5s ease-in-out infinite;
        }

        .modal-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            flex: 1;
            text-align: center;
        }

        .modal-close-wrapper:active {
            --press-scale: 1.08;
        }

        @keyframes exitFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            50% { transform: translate(-2px, 2px) scale(var(--press-scale)); }
        }

        .modal-close-img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .modal-section {
            display: none;
            width: 100%;
        }

        .modal-section.active {
            display: block;
        }

        /* --- Табы для окна Achv --- */
        .achv-tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            position: relative;
            z-index: 101;
        }

        .achv-tab-wrapper {
            width: 70px;
            height: 70px;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: transform .1s ease;
            animation: tabFloat 3.5s ease-in-out infinite;
        }

        .achv-tab-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        @keyframes tabFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            50% { transform: translate(0, -3px) scale(var(--press-scale)); }
        }

        .achv-tab-wrapper.active {
            transform: scale(1.15);
        }

        /* --- Лидерборд --- */
        .leaderboard-wrapper {
            position: relative;
            min-height: 300px;
        }

        .leaderboard-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .leaderboard-loading-img {
            width: 200px;
            height: 200px;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .leaderboard-refresh-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: leaderboardFloat 4s ease-in-out infinite;
            transition: transform .1s ease;
        }

        .leaderboard-refresh-img {
            width: 40px;
            height: 40px;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .leaderboard-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            margin-bottom: 8px;
            margin-top: -6px;
            min-height: 46px;
        }

        .leaderboard-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-left: auto;
        }

        .leaderboard-nav-btn {
            width: 54px;
            height: 54px;
            border: none;
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: transform .1s ease;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        .leaderboard-nav-img {
            width: 28px;
            height: auto;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .leaderboard-nav-btn:active {
            transform: scale(1.08);
        }

        .leaderboard-nav-btn:disabled {
            opacity: .45;
            transform: none;
        }

        .leaderboard-page-info {
            min-width: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        .leaderboard-page-info img,
        .leaderboard-page-digit {
            height: 22px;
            width: auto;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
            animation: leaderboardFloat 4s ease-in-out infinite;
            transition: transform .18s ease-out;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        @keyframes leaderboardFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            25% { transform: translate(2px, -2px) scale(var(--press-scale)); }
            50% { transform: translate(-2px, 2px) scale(var(--press-scale)); }
            75% { transform: translate(2px, 2px) scale(var(--press-scale)); }
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .leaderboard-user-row {
            display: flex !important;
            width: 100%;
            justify-content: space-between;
            margin-top: 6px;
            border: 2px solid var(--tg-theme-link-color, #0088cc);
            background: var(--tg-theme-secondary-bg-color, #f4f7fb);
            box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
            padding: 12px;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        .leaderboard-user-row .leaderboard-rank {
            color: var(--tg-theme-link-color, #0088cc);
        }

        .leaderboard-rank-name {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .leaderboard-rank {
            font-size: 20px;
            font-weight: bold;
            width: 40px;
            text-align: left;
            color: var(--tg-theme-link-color, #0088cc);
        }

        .leaderboard-name {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            text-align: left;
            color: var(--tg-theme-text-color, #000);
            position: relative;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .leaderboard-name-text {
            display: block;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: opacity .2s ease;
        }

        .leaderboard-name span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            transition: opacity .2s ease;
        }

        .leaderboard-name-alt {
            position: absolute;
            left: 0;
            top: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            padding-right: 6px;
            white-space: nowrap;
            width: 100%;
        }

        .leaderboard-name.show-alt {
            justify-content: flex-start;
        }

        .leaderboard-name-alt img {
            height: 18px;
            width: auto;
        }

        .leaderboard-name.show-alt .leaderboard-name-text {
            opacity: 0;
        }

        .leaderboard-name.show-alt .leaderboard-name-alt {
            opacity: 1;
        }

        .orientation-lock-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20000;
            background: rgba(0, 0, 0, 0.92);
            text-align: center;
            padding: 30px;
            align-items: center;
            justify-content: center;
            user-select: none;
            pointer-events: all;
        }

        .orientation-lock-overlay img {
            width: min(220px, 60%);
            height: auto;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            animation: floatSlow 4s ease-in-out infinite;
        }

        .no-save-img {
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-2px, -3px); }
            66% { transform: translate(2px, 2px); }
        }

        @media (orientation: landscape) {
            .orientation-lock-overlay {
                display: flex;
            }

            .game,
            .ui-container,
            .modal {
                filter: blur(4px);
            }
        }

        /* --- Настройки --- */
        .settings-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
        }

        .radio-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-btn {
            width: 108px;
            height: 108px;
            flex-shrink: 0;
            aspect-ratio: 1/1;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: radioFloat 3.5s ease-in-out infinite;
            transition: transform .1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            margin-top: 0;
        }

        .action-btn {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            aspect-ratio: 1/1;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: hardResetFloat 3.5s ease-in-out infinite;
            transition: transform .1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats-img,
        .hard-reset-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .radio-btn:active,
        .sound-toggle-wrapper:active,
        .vol-btn-wrapper:active,
        .action-btn:active,
        .reset-btn-wrapper:active,
        .modal-close-wrapper:active,
        .leaderboard-nav-btn:active {
            transform: scale(1.08);
        }

        .pressable {
            --press-scale: 1;
            transition: transform .2s cubic-bezier(0.2, 0, 0.2, 1);
            transform: scale(var(--press-scale));
        }

        .pressable.pressed {
            --press-scale: 1.08;
        }

        .ui-btn-wrapper[data-modal="shop"].pressable.pressed {
            --press-scale: 1.06;
        }

        .pressable.released {
            --press-scale: 0.96;
        }

        @keyframes radioFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            50% { transform: translate(2px, -2px) scale(var(--press-scale)); }
        }

        .radio-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 5px;
            margin-bottom: 24px;
            position: relative;
        }

        .volume-background {
            position: absolute;
            left: 0;
            right: 0;
            height: 58px; /* 50 + 4 + 4 */
            top: -4px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 29px; /* 25 + 4 */
            z-index: -1;
            animation: volBgFloat 3.5s ease-in-out infinite;
        }

        @keyframes volBgFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .vol-btn-wrapper {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: volBtnFloat 3.5s ease-in-out infinite;

            if (!gameState.settings.soundEnabled) return;
            if (!audioCtx || !buffer) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            gain.gain.value = volume;
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(audioCtx.destination);

                console.error("Radio error, retrying...");

                    setTimeout(() => {
                        recreateRadioAudio();
                        if (isRadioPlaying) tryPlayRadioSync();

            if (!radioAudio) return;

                setTimeout(() => { radioAudio.muted = false; }, 100);

                console.log("Radio play failed:", err);
                radioRetryCount++;
                if (radioRetryCount <= 3) {
                    setTimeout(() => {
                        recreateRadioAudio();
                        tryPlayRadioSync();
                    }, 1000);

            });

        function applyPressAnimation(selector) {
            document.querySelectorAll(selector).forEach(element => {
                element.classList.add('pressable');
                let releaseTimer = null;

                const clearRelease = () => {
                    if (releaseTimer) {
                        clearTimeout(releaseTimer);
                        releaseTimer = null;
                    }
                    element.classList.remove('pressed');
                    element.classList.remove('released');
                };

                const pressStart = () => {
                    clearRelease();
                    element.classList.add('pressed');
                };

                const pressEnd = () => {
                    element.classList.remove('pressed');
                    element.classList.add('released');
                    releaseTimer = setTimeout(() => {
                        element.classList.remove('released');
                        releaseTimer = null;
                    }, 120);
                };

                element.addEventListener('pointerdown', pressStart);
                element.addEventListener('mousedown', pressStart);
                element.addEventListener('touchstart', pressStart, { passive: true });

                element.addEventListener('pointerup', pressEnd);
                element.addEventListener('mouseup', pressEnd);
                element.addEventListener('touchend', pressEnd);

                element.addEventListener('pointerleave', clearRelease);
                element.addEventListener('pointerout', clearRelease);
                element.addEventListener('pointercancel', clearRelease);
                element.addEventListener('touchcancel', clearRelease);
            });
        }

        function attachReleaseAction(element, action) {
            let isPressed = false;
            let pointerId = null;

            const getPoint = (e) => {
                if (e.changedTouches && e.changedTouches.length > 0) {
                    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                }
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                if (typeof e.clientX === 'number' && typeof e.clientY === 'number') {
                    return { x: e.clientX, y: e.clientY };
                }
                return null;
            };

            const isInside = (point) => {
                if (!point) return false;
                const rect = element.getBoundingClientRect();
                return point.x >= rect.left && point.x <= rect.right && point.y >= rect.top && point.y <= rect.bottom;
            };

            const startPress = (e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();
                isPressed = true;
                pointerId = e.pointerId || null;
                if (e.pointerId && element.setPointerCapture) {
                    try { element.setPointerCapture(e.pointerId); } catch (err) {}
                }
            };

            const movePress = (e) => {
                if (!isPressed) return;
                if (e.pointerId && pointerId !== null && e.pointerId !== pointerId) return;
                const point = getPoint(e);
                if (!isInside(point)) {
                    clearPress();
                }
            };

            const endPress = (e) => {
                if (!isPressed) return;
                if (e.pointerId && pointerId !== null && e.pointerId !== pointerId) return;
                const point = getPoint(e);
                clearPress();
                if (!isInside(point)) return;
                e.preventDefault();
                e.stopPropagation();
                action(e);
            };

            const clearPress = () => {
                if (pointerId !== null && element.releasePointerCapture) {
                    try { element.releasePointerCapture(pointerId); } catch (err) {}
                }
                isPressed = false;
                pointerId = null;
            };

            element.addEventListener('pointerdown', startPress);
            element.addEventListener('mousedown', startPress);
            element.addEventListener('touchstart', startPress, { passive: false });
            element.addEventListener('pointermove', movePress);
            element.addEventListener('mousemove', movePress);
            element.addEventListener('touchmove', movePress, { passive: false });
            element.addEventListener('pointerup', endPress);
            element.addEventListener('mouseup', endPress);
            element.addEventListener('touchend', endPress, { passive: false });
            element.addEventListener('pointerleave', clearPress);
            element.addEventListener('mouseleave', clearPress);
            element.addEventListener('pointercancel', clearPress);
            element.addEventListener('touchcancel', clearPress);
        }

        // --- Firebase функции ---
        async function updateFirebaseScore() {
            const userKey = tgUserId; 
            if (!userKey) return;
            const currentScore = getClicks(); // Используем защищенную функцию

            try {
                const userRef = ref(db, 'leaderboard/' + userKey);
                await runTransaction(userRef, (currentData) => {
                    if (currentData === null) return { name: userName, score: currentScore, lastUpdated: Date.now() };
                    if (currentScore > currentData.score) return { ...currentData, name: userName, score: currentScore, lastUpdated: Date.now() };
                if (currentData.score > currentScore) {
                    setClicks(currentData.score); // Обновляем защищенную переменную
                    updateCounterDisplay();
                }
                return currentData;
                });
            } catch (e) {
                console.error("Firebase update error:", e);
            }
        }

        async function loadLeaderboard() {
            const shouldShowLoading = !hasLoadedLeaderboardOnce;
            resetLeaderboardPagination();
            leaderboardPage = 0;
            if (shouldShowLoading) {
                leaderboardLoading.style.display = 'flex';
                leaderboardList.style.display = 'none';
                leaderboardRefreshTop.style.display = 'none';
                leaderboardControls.style.display = 'none';
                leaderboardUserRow.style.display = 'none';
            }
            
            try {
                const snapshot = await get(ref(db, 'leaderboard'));
                if (!snapshot.exists()) {
                    renderLeaderboard([]);
                    return;
                }

                const rawEntries = Object.entries(snapshot.val() || {});
                const players = rawEntries
                    .filter(([, player]) => player && typeof player.score === 'number')
                    .map(([id, player]) => ({
                        id,
                        name: player.name || 'Unknown',
                        score: player.score
                    }))
                    .sort((a, b) => b.score - a.score);

                renderLeaderboard(players);
            } catch (e) {
                console.error("Firebase load error:", e);
                renderLeaderboard([]);
            } finally {
                if (shouldShowLoading) {
                    leaderboardLoading.style.display = 'none';
                    leaderboardList.style.display = 'flex';
                    leaderboardRefreshTop.style.display = 'flex';
                    leaderboardControls.style.display = 'flex';
                    leaderboardUserRow.style.display = 'flex';
                    hasLoadedLeaderboardOnce = true;
                }
            }
        }

        async function loadLocalGame() {
            try {
                if (tg && tg.CloudStorage) {
                    const dataStr = await new Promise((resolve, reject) => 
                        tg.CloudStorage.getItem('gameData', (err, value) => err ? reject(err) : resolve(value))
                    );
                    if (dataStr) {
                        const parsed = decodeGameData(dataStr);
                        if (parsed) {
                            gameState = { ...gameState, ...parsed };
                            if (parsed.settings) gameState.settings = { ...defaultSettings, ...parsed.settings };
                            gameState.settings.radioEnabled = 0;
                            
                            setClicks(gameState.score || 0);
                            totalClicksCounter = gameState.totalClicksCounter || 0; // Загружаем общий счетчик
                            bonusesCollected = gameState.bonusesCollected || 0;
                            timePlayedSeconds = gameState.timePlayedSeconds || 0;
                            shopPurchases = gameState.shopPurchases || 0;
                            criticalClicks = gameState.criticalClicks || 0;
                            abilityActivations = gameState.abilityActivations || 0;
                            achievements = gameState.achievementsCounter || 0;
                            unlockedAchievements = new Set(gameState.achievements || []);

                        }
                    }
                }
            } catch (e) {
                console.error('Local load error:', e);
            }
        }

        async function saveLocalGame() {
            gameState.score = getClicks(); // Читаем безопасные очки
            gameState.totalClicksCounter = totalClicksCounter; // Сохраняем общий счетчик
            
            gameState.bonusesCollected = bonusesCollected;
            gameState.timePlayedSeconds = timePlayedSeconds;
            gameState.shopPurchases = shopPurchases;
            gameState.criticalClicks = criticalClicks;
            gameState.abilityActivations = abilityActivations;
            gameState.achievementsCounter = achievements;
            gameState.achievements = Array.from(unlockedAchievements);

            const saveState = {
                ...gameState,
                settings: {
                    ...gameState.settings,
                    radioEnabled: 0
                }
            };
            try {
                if (tg && tg.CloudStorage) {
                    // Кодируем данные перед сохранением
                    const encodedData = encodeGameData(saveState);
                    await new Promise((resolve, reject) => 
                        tg.CloudStorage.setItem('gameData', encodedData, (err) => err ? reject(err) : resolve(true))
                    );
                }
            } catch (e) {
                console.error('Local save error:', e);
            }
        }

        // --- Игровая логика ---
        function processClick(e) {
            // Anti-autoclicker logic (Soft limit: Physical click limits, NOT score limits)
            const now = Date.now();
            clickTimestamps = clickTimestamps.filter(t => now - t < 1000);
            if (clickTimestamps.length > MAX_CLICKS_PER_SECOND) {
                if (e && e.cancelable) e.preventDefault();
                return; // Игнорируем подозрительно быстрые клики
            }
            clickTimestamps.push(now);

            if (e && e.cancelable) e.preventDefault();
            
            // Начисление очков с бонусами
            addClicks(1 * clickMultiplier * gameState.upgrades.clickPower);
            
            // Увеличиваем общий счетчик кликов
            totalClicksCounter += 1;
            
            updateCounterDisplay();
            updateStatsPanel(); // Обновляем статистику
            playSound(buffers.pop, 0.5);
            triggerHaptic('light');
            
            image.style.transform = "scale(1.1) scaleY(0.9)";
            counterWrapper.classList.remove("pop");
            void counterWrapper.offsetWidth;
            counterWrapper.classList.add("pop");
            scheduleSave();

        }

// --- Функция умной авторизации ---
async function authTelegramUser() {
    if (!tgUserId) {
        // Если открыли вне телеграма - пускаем как обычного гостя
        await signInAnonymously(auth);
        return;
    }

    // Генерируем уникальный, но постоянный email для этого игрока
    const email = `tg_${tgUserId}@fumoclick.app`;

    // Ищем пароль в Telegram CloudStorage (он синхронизируется между ПК и телефоном)
    let password = await new Promise((resolve) => {
        tg.CloudStorage.getItem('fb_pass', (err, val) => resolve(val || null));
    });

    if (!password) {
        // Пароля нет (первый вход). Генерируем надежный случайный пароль.
        password = Math.random().toString(36).slice(-10) + Math.random().toString(36).slice(-10);
        await new Promise((resolve) => {
            tg.CloudStorage.setItem('fb_pass', password, () => resolve());
        });

        try {
            // Создаем аккаунт в Firebase
            await createUserWithEmailAndPassword(auth, email, password);
        } catch (e) {
            console.error("Ошибка регистрации:", e);
            await signInAnonymously(auth); // Запасной план
        }
    } else {
        // Пароль найден (человек зашел с другого устройства)
        try {
            // Входим в тот же самый аккаунт
            await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
            if (e.code === 'auth/user-not-found') {
                await createUserWithEmailAndPassword(auth, email, password);
            } else {
                console.error("Ошибка входа:", e);
                await signInAnonymously(auth);
            }
        }
    }
}

// Изменяем блок preloadResources, чтобы использовать нашу новую функцию
async function preloadResources() {
    initAudioContext();

    
    try {
        // ВМЕСТО signInAnonymously(auth) вызываем нашу умную авторизацию:
        await authTelegramUser();
        console.log("Авторизация прошла успешно. Email:", auth.currentUser?.email);
    } catch (e) {
        console.error("Ошибка авторизации:", e);
        const loadingText = document.getElementById('loadingText');
        if (loadingText) loadingText.textContent = "ОШИБКА СЕТИ";
        return;
    }
            
            await loadLocalGame();

            const imgPromises = imageUrls.map(url => new Promise(resolve => {
                let done = false;
                const finish = () => { if (!done) { done = true; resolve(); } };
                const img = new Image();
                img.addEventListener('load', finish, { once: true });
                img.addEventListener('error', finish, { once: true });
                img.src = url;
                setTimeout(finish, 3000);
            }));
            
            const soundPromises = Object.entries(soundUrls).map(async ([key, url]) => {
                try {
                    const r = await fetch(url);
                    buffers[key] = await audioCtx.decodeAudioData(await r.arrayBuffer());
                } catch (e) {}
            });
            await Promise.race([
                Promise.all([...imgPromises, ...soundPromises]),
                new Promise(resolve => setTimeout(resolve, 5000))
            ]);

            await new Promise(r => setTimeout(r, 300));
            loadingScreen.classList.add('hidden');
            gameContainer.classList.add('visible');
            
            setMainBackground(); // Устанавливаем фон для основного экрана
            initGame();
            initRadio();
        }
        

        function initGame() {
            for (let i = 0; i <= 9; i++) {
                const img = document.createElement("img");
                img.src = `https://raw.githubusercontent.com/wei9htlessness/FUMOCLICK/main/numbers/${i}.png`;
                img.className = "digit-img";
                assetCache.appendChild(img);
            }
            updateCounterDisplay();
            scheduleNextBoost();
            startStatsTimer();
            setInterval(() => { saveLocalGame(); updateFirebaseScore(); }, 10000);
            updateAchievementsUI(); // Обновляем UI достижений после инициализации
        }

        preloadResources();
    </script>
