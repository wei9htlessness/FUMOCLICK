<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FUMOCLICK</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/wei9htlessness/FUMOCLICK/main/favicon.ico">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* --- Базовые стили и сброс --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            min-width: 100vw;
            min-height: 100vh;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-family: Arial, Helvetica, sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* --- Экран загрузки --- */
        #assetCache {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--tg-theme-bg-color, #fff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity .5s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            border: 5px solid rgba(128, 128, 128, .2);
            border-top: 5px solid var(--tg-theme-text-color, #000);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }

        #loadingText {
            font-size: 18px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #000);
        }

        /* --- Игровая зона --- */
        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            opacity: 0;
            transition: opacity .5s ease;
            margin-top: -135px;
        }

        .game.visible {
            opacity: 1;
        }

        /* Контейнер для счетчика - позиционирован относительно для абсолютного размещения индикаторов */
        .counter-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: counterFloat 2.1s ease-in-out infinite;
            z-index: 25;
        }

        .counter-wrapper.pop {
            animation: counterFloat 2.1s ease-in-out infinite, counterPop .18s ease;
        }

        #counter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
        }

        .digit-img {
            height: 72px;
            width: auto;
            display: block;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Индикаторы бонуса x2 и cursor - абсолютно позиционированы под счетчиком, перекрывают fumo */
        .boost-indicators {
            position: absolute;
            top: 150%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: -20px;
            opacity: 0;
            transition: opacity .3s ease;
            z-index: 30;
            pointer-events: none;
        }

        .boost-indicators.active {
            opacity: 1;
        }

        .boost-indicator-img {
            width: 70px;
            height: auto;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .cursor-indicator {
            width: 23px;
        }

        .x2-indicator,
        .cursor-indicator {
            animation: x2Pulse .3s ease-in-out infinite alternate;
        }

        @keyframes x2Pulse {
            0% { transform: scale(.8); }
            100% { transform: scale(1.2); }
        }

        @keyframes counterFloat {
            0%, 100% { transform: translateY(-7px); }
            50% { transform: translateY(7px); }
        }

        @keyframes counterPop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.12); }
        }

        #clickArea {
            margin-top: 20px;
            animation: idle 3.5s ease-in-out infinite;
            transform-origin: center bottom;
            -webkit-touch-callout: none;
            touch-action: none;
            position: relative;
            z-index: 10;
        }

        #clickImage {
            height: 60vh;
            width: auto;
            display: block;
            pointer-events: none;
            transform: scale(1);
            transition: transform .15s ease-out;
            -webkit-user-drag: none;
            transform-origin: center bottom;
        }

        @keyframes idle {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        /* --- Бонус Monster Energy --- */
        .boost-container {
            position: absolute;
            width: 150px;
            height: 150px;
            z-index: 1000;
            touch-action: none;
        }

        .boost-spring {
            width: 100%;
            height: 100%;
        }

        .boost-spring.spawning {
            animation: boostSpawn 1s ease-out forwards;
        }

        .boost-spring.despawning {
            animation: boostDespawn .15s ease-in forwards;
            pointer-events: none;
        }

        .boost-sway {
            width: 100%;
            height: 100%;
            animation: boostSway 2s ease-in-out infinite;
        }

        .boost-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: boostPulse .25s ease-in-out infinite alternate;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        @keyframes boostSpawn {
            0% { transform: scale(0); }
            40% { transform: scale(1.35); }
            60% { transform: scale(.85); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes boostDespawn {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: .8; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes boostSway {
            0%, 100% { transform: translateX(0) rotate(-6deg); }
            50% { transform: translateX(15px) rotate(6deg); }
        }

        @keyframes boostPulse {
            0% { transform: scale(.85); }
            100% { transform: scale(1.15); }
        }

        /* --- Нижние кнопки UI --- */
        .ui-container {
            position: fixed;
            bottom: 45px;
            left: calc(50% + 2px);
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            gap: 0;
            z-index: 100;
        }

        .ui-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 107px;
            margin-left: -15px;
        }

        .ui-btn-wrapper {
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: transform .1s ease;
        }

        .ui-btn-img {
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .ui-btn-small { width: 65px; height: 49px; }
        .ui-btn-large { width: 148px; height: 107px; margin-left: 15px; }

        .ui-btn-achv { animation: uiFloat1 3s ease-in-out infinite; }
        .ui-btn-settings { animation: uiFloat2 3.5s ease-in-out infinite; }
        .ui-btn-shop { animation: uiFloat3 4s ease-in-out infinite; }

        @keyframes uiFloat1 { 0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); } 50% { transform: translate(-3px, -3px) scale(var(--press-scale)); } }
        @keyframes uiFloat2 { 0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); } 50% { transform: translate(3px, -3px) scale(var(--press-scale)); } }
        @keyframes uiFloat3 { 0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); } 50% { transform: translate(-3px, 3px) scale(var(--press-scale)); } }

        /* --- Модальные окна --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--tg-theme-bg-color, #fff);
            z-index: 10000;
            display: none;
            opacity: 0;
            transition: opacity .3s ease;
        }

        .modal.active {
            display: block;
            opacity: 1;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            max-height: 80%;
            overflow-y: auto;
            padding: 20px;
            text-align: center;
        }

        .modal-close-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: transform .18s ease-out;
            animation: exitFloat 3.5s ease-in-out infinite;
        }

        .modal-close-wrapper:active {
            --press-scale: 1.08;
        }

        @keyframes exitFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            50% { transform: translate(-2px, 2px) scale(var(--press-scale)); }
        }

        .modal-close-img {
            width: 100%;
            height: 100%;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .modal-section {
            display: none;
            width: 100%;
        }

        .modal-section.active {
            display: block;
        }

        /* --- Лидерборд --- */
        .leaderboard-wrapper {
            position: relative;
            min-height: 300px;
        }

        .leaderboard-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .leaderboard-loading-img {
            width: 200px;
            height: 200px;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .leaderboard-refresh-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: leaderboardFloat 4s ease-in-out infinite;
            transition: transform .1s ease;
        }

        .leaderboard-refresh-img {
            width: 40px;
            height: 40px;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .leaderboard-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            margin-bottom: 8px;
            margin-top: -6px;
            min-height: 46px;
        }

        .leaderboard-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-left: auto;
        }

        .leaderboard-nav-btn {
            width: 54px;
            height: 54px;
            border: none;
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: transform .1s ease;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        .leaderboard-nav-img {
            width: 28px;
            height: auto;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .leaderboard-nav-btn:active {
            transform: scale(1.08);
        }

        .leaderboard-nav-btn:disabled {
            opacity: .45;
            transform: none;
        }

        .leaderboard-nav-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .leaderboard-page-info {
            min-width: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        .leaderboard-page-info,
        .leaderboard-page-info img,
        .leaderboard-page-digit {
            --press-scale: 1;
        }

        .leaderboard-page-info img,
        .leaderboard-page-digit {
            height: 22px;
            width: auto;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
            animation: leaderboardFloat 4s ease-in-out infinite;
            transition: transform .18s ease-out;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        @keyframes leaderboardFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            25% { transform: translate(2px, -2px) scale(var(--press-scale)); }
            50% { transform: translate(-2px, 2px) scale(var(--press-scale)); }
            75% { transform: translate(2px, 2px) scale(var(--press-scale)); }
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--tg-theme-bg-color, #fff);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .leaderboard-user-row {
            display: flex !important;
            width: 100%;
            justify-content: space-between;
            margin-top: 6px;
            border: 2px solid var(--tg-theme-link-color, #0088cc);
            background: var(--tg-theme-secondary-bg-color, #f4f7fb);
            box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
            padding: 12px;
            animation: leaderboardFloat 4s ease-in-out infinite;
        }

        .leaderboard-user-row .leaderboard-rank {
            color: var(--tg-theme-link-color, #0088cc);
        }

        .leaderboard-rank-name {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .leaderboard-rank {
            font-size: 20px;
            font-weight: bold;
            width: 40px;
            text-align: left;
            color: var(--tg-theme-link-color, #0088cc);
        }

        .leaderboard-name {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            text-align: left;
            color: var(--tg-theme-text-color, #000);
            position: relative;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .leaderboard-name-text {
            display: block;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            transition: opacity .2s ease;
        }

        .leaderboard-name span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            transition: opacity .2s ease;
        }

        .leaderboard-name-alt {
            position: absolute;
            left: 0;
            top: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            padding-right: 6px;
            white-space: nowrap;
            width: 100%;
        }

        .leaderboard-name.show-alt {
            justify-content: flex-start;
        }

        .leaderboard-name-alt img {
            height: 18px;
            width: auto;
        }

        .leaderboard-name.show-alt .leaderboard-name-text {
            opacity: 0;
        }

        .leaderboard-name.show-alt .leaderboard-name-alt {
            opacity: 1;
        }

        .orientation-lock-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20000;
            background: rgba(0, 0, 0, 0.92);
            text-align: center;
            padding: 30px;
            align-items: center;
            justify-content: center;
            user-select: none;
            pointer-events: all;
        }

        .orientation-lock-overlay img {
            width: min(220px, 60%);
            height: auto;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            animation: floatSlow 4s ease-in-out infinite;
        }

        .no-save-img {
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-2px, -3px); }
            66% { transform: translate(2px, 2px); }
        }

        @media (orientation: landscape) {
            .orientation-lock-overlay {
                display: flex;
            }

            .game,
            .ui-container,
            .modal {
                filter: blur(4px);
            }
        }

        .leaderboard-score {
            display: flex;
            gap: 1px;
            align-items: center;
            margin-left: auto;
        }

        .leaderboard-score img {
            height: 20px;
            width: auto;
            -webkit-user-drag: none;
            pointer-events: none;
            -webkit-touch-callout: none;
        }

        /* --- Настройки --- */
        .settings-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
        }

        .radio-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-btn {
            width: 108px;
            height: 108px;
            flex-shrink: 0;
            aspect-ratio: 1/1;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: radioFloat 3.5s ease-in-out infinite;
            transition: transform .1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            margin-top: 0;
        }

        .action-btn {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            aspect-ratio: 1/1;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: hardResetFloat 3.5s ease-in-out infinite;
            transition: transform .1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .donate-img,
        .hard-reset-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .radio-btn:active,
        .sound-toggle-wrapper:active,
        .vol-btn-wrapper:active,
        .action-btn:active,
        .reset-btn-wrapper:active,
        .modal-close-wrapper:active,
        .leaderboard-nav-btn:active {
            transform: scale(1.08);
        }

        .pressable {
            --press-scale: 1;
            transition: transform .18s ease-out;
            transform: scale(var(--press-scale));
        }

        .pressable.pressed {
            --press-scale: 1.08;
        }

        .ui-btn-wrapper[data-modal="shop"].pressable.pressed {
            --press-scale: 1.06;
        }

        .pressable.released {
            --press-scale: 0.96;
        }

        @keyframes radioFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            50% { transform: translate(2px, -2px) scale(var(--press-scale)); }
        }

        .radio-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 5px;
            margin-bottom: 24px;
        }

        .vol-btn-wrapper {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: volBtnFloat 3.5s ease-in-out infinite;
            transition: transform .1s ease;
        }

        .vol-btn-wrapper.minus-btn {
            justify-content: flex-start;
        }

        .vol-btn-wrapper.plus-btn {
            justify-content: flex-end;
        }

        @keyframes volBtnFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            50% { transform: translate(-2px, 2px) scale(var(--press-scale)); }
        }

        .vol-btn-img {
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .volume-display {
            display: flex;
            gap: 2px;
            align-items: center;
            min-width: 90px;
            justify-content: center;
            animation: volFloat 3.5s ease-in-out infinite;
        }

        @keyframes volFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .volume-display img {
            height: 24px;
            width: auto;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .sound-toggle-wrapper {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            aspect-ratio: 1/1;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: soundFloat 3.5s ease-in-out infinite;
            transition: transform .1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes soundFloat {
            0%, 100% { transform: translate(0, 0) scale(var(--press-scale)); }
            50% { transform: translate(-2px, 2px) scale(var(--press-scale)); }
        }

        .sound-toggle-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .hard-reset-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            width: 100%;
        }

        .hard-reset-btn {
            width: 120px;
            height: 120px;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            animation: hardResetFloat 3.5s ease-in-out infinite;
            transition: transform .1s ease;
            display: flex;
            align-items: center;
            justify-content: center;

        // --- Аудио система ---
        function initAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.error("AudioContext error:", e);
                }
            }
        }

        function playSound(buffer, volume = 0.5) {
            if (!gameState.settings.soundEnabled) return;
            if (!audioCtx || !buffer) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            gain.gain.value = volume;
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(0);
        }

        // --- Работа с радио ---
        function recreateRadioAudio() {
            // recreate the radio element when needed and keep it muted initially
            if (radioAudio) {
                radioAudio.pause();
                radioAudio.src = '';
                radioAudio = null;
            }
            
            radioAudio = document.createElement('audio');
            radioAudio.src = 'https://radio.loficafe.net/listen/japanese-lofi/radio.mp3';
            radioAudio.loop = true;
            radioAudio.preload = 'auto';
            radioAudio.setAttribute('playsinline', '');
            radioAudio.setAttribute('webkit-playsinline', '');
            radioAudio.volume = (gameState.settings.radioVolume / 100) * 0.2;
            radioAudio.muted = true;

            radioAudio.addEventListener('error', () => {
                console.error("Radio error, retrying...");
                radioRetryCount++;
                if (radioRetryCount <= 3) {
                    setTimeout(() => {
                        recreateRadioAudio();
                        if (isRadioPlaying) tryPlayRadioSync();
                    }, 2000);
                }
            });
        }

        function tryPlayRadioSync() {
            if (!radioAudio) return;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            radioAudio.muted = true;
            radioAudio.play().then(() => {
                setTimeout(() => { radioAudio.muted = false; }, 100);
                isRadioPlaying = true;
                radioRetryCount = 0;
                updateRadioUI();
            }).catch(err => {
                console.log("Radio play failed:", err);
                radioRetryCount++;
                if (radioRetryCount <= 3) {
                    setTimeout(() => {
                        recreateRadioAudio();
                        tryPlayRadioSync();
                    }, 1000);
                }
            });
        }

        function initRadio() {
            // initialize radio state on app launch and do not start playback automatically
            recreateRadioAudio();
            const vol = gameState.settings.radioVolume !== undefined ? gameState.settings.radioVolume : 50;
            gameState.settings.radioVolume = vol;
            radioAudio.volume = (vol / 100) * 0.2;
            updateVolumeDisplay(vol);
            
            isRadioPlaying = false;
            gameState.settings.radioEnabled = 0;
            updateRadioUI();
            updateSoundUI();
        }

            // preload hard reset loop so it starts immediately when pressed
            if (!hardResetAudio) {
                hardResetAudio = new Audio(soundUrls.hardresetloop);
                hardResetAudio.loop = true;
                hardResetAudio.preload = 'auto';
                hardResetAudio.volume = 0.50; // reduce loop volume by 50%
                hardResetAudio.muted = !gameState.settings.soundEnabled;
                hardResetAudio.setAttribute('playsinline', '');
                hardResetAudio.setAttribute('webkit-playsinline', '');
                hardResetAudio.load();
            }
        }

        function playHardResetLoop() {
            ensureHardResetAudio();
            if (!hardResetAudio) return;

            // pause any current radio playback when the hard reset modal opens
            radioWasPlayingBeforeHardReset = isRadioPlaying;

            isRadioPlaying = false;
            updateRadioUI();

            hardResetAudio.currentTime = 0;
            hardResetAudio.play().catch(() => {});
            isHardResetAudioPlaying = true;
        }

        function stopHardResetLoop() {
            if (!hardResetAudio) return;
            hardResetAudio.pause();
            hardResetAudio.currentTime = 0;
            isHardResetAudioPlaying = false;

            // restore radio only if it was playing before the hard reset modal opened
            if (radioWasPlayingBeforeHardReset && radioAudio) {
                radioWasPlayingBeforeHardReset = false;
                tryPlayRadioSync();

                const clearRelease = () => {
                    if (releaseTimer) {
                        clearTimeout(releaseTimer);
                        releaseTimer = null;
                    }
                    element.classList.remove('pressed');
                    element.classList.remove('released');
                };

                const pressStart = () => {
                    clearRelease();
                    element.classList.add('pressed');
                };

                const pressEnd = () => {
                    element.classList.remove('pressed');
                    element.classList.add('released');
                    releaseTimer = setTimeout(() => {
                        element.classList.remove('released');
                        releaseTimer = null;
                    }, 120);
                };

                element.addEventListener('pointerdown', pressStart);
                element.addEventListener('mousedown', pressStart);
                element.addEventListener('touchstart', pressStart, { passive: true });

                element.addEventListener('pointerup', pressEnd);
                element.addEventListener('mouseup', pressEnd);
                element.addEventListener('touchend', pressEnd);

                element.addEventListener('pointerleave', clearRelease);
                element.addEventListener('pointerout', clearRelease);
                element.addEventListener('pointercancel', clearRelease);
                element.addEventListener('touchcancel', clearRelease);
            });
        }

        function attachReleaseAction(element, action) {
            let isPressed = false;
            let pointerId = null;

            const getPoint = (e) => {
                if (e.changedTouches && e.changedTouches.length > 0) {
                    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                }
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                if (typeof e.clientX === 'number' && typeof e.clientY === 'number') {
                    return { x: e.clientX, y: e.clientY };
                }
                return null;
            };

            const isInside = (point) => {
                if (!point) return false;
                const rect = element.getBoundingClientRect();
                return point.x >= rect.left && point.x <= rect.right && point.y >= rect.top && point.y <= rect.bottom;
            };

            const startPress = (e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();
                isPressed = true;
                pointerId = e.pointerId || null;
                if (e.pointerId && element.setPointerCapture) {
                    try { element.setPointerCapture(e.pointerId); } catch (err) {}
                }
            };

            const movePress = (e) => {
                if (!isPressed) return;
                if (e.pointerId && pointerId !== null && e.pointerId !== pointerId) return;
                const point = getPoint(e);
                if (!isInside(point)) {
                    clearPress();
                }
            };

            const endPress = (e) => {
                if (!isPressed) return;
                if (e.pointerId && pointerId !== null && e.pointerId !== pointerId) return;
                const point = getPoint(e);
                clearPress();
                if (!isInside(point)) return;
                e.preventDefault();
                e.stopPropagation();
                action(e);
            };

            const clearPress = () => {
                if (pointerId !== null && element.releasePointerCapture) {
                    try { element.releasePointerCapture(pointerId); } catch (err) {}
                }
                isPressed = false;
                pointerId = null;
            };

            element.addEventListener('pointerdown', startPress);
            element.addEventListener('mousedown', startPress);
            element.addEventListener('touchstart', startPress, { passive: false });

            element.addEventListener('pointermove', movePress);
            element.addEventListener('mousemove', movePress);
            element.addEventListener('touchmove', movePress, { passive: false });

            element.addEventListener('pointerup', endPress);
            element.addEventListener('mouseup', endPress);
            element.addEventListener('touchend', endPress, { passive: false });

            element.addEventListener('pointerleave', clearPress);
            element.addEventListener('mouseleave', clearPress);
            element.addEventListener('pointercancel', clearPress);
            element.addEventListener('touchcancel', clearPress);
        }

        // --- Firebase функции ---
        async function updateFirebaseScore() {
            if (!tgUserId) return;
            try {
                const userRef = ref(db, 'leaderboard/' + tgUserId);
                await runTransaction(userRef, (currentData) => {
                    if (currentData === null) return { name: userName, score: clicks, lastUpdated: Date.now() };
                    if (clicks > currentData.score) return { name: userName, score: clicks, lastUpdated: Date.now() };
                    clicks = currentData.score;
                    updateCounterDisplay();
                    return currentData;
                });
            } catch (e) {
                console.error("Firebase update error:", e);
            }
        }

        async function loadLeaderboard() {
            const shouldShowLoading = !hasLoadedLeaderboardOnce;
            resetLeaderboardPagination();
            leaderboardPage = 0;
            if (shouldShowLoading) {
                leaderboardLoading.style.display = 'flex';
                leaderboardList.style.display = 'none';
                leaderboardRefreshTop.style.display = 'none';
                leaderboardControls.style.display = 'none';
                leaderboardUserRow.style.display = 'none';
            }
            
            try {
                const snapshot = await get(ref(db, 'leaderboard'));
                if (!snapshot.exists()) {
                    renderLeaderboard([]);
                    return;
                }

                const rawEntries = Object.entries(snapshot.val() || {});
                const players = rawEntries
                    .filter(([, player]) => player && typeof player.score === 'number')
                    .map(([id, player]) => ({
                        id,
                        name: player.name || 'Unknown',
                        score: player.score
                    }))
                    .sort((a, b) => b.score - a.score);

                renderLeaderboard(players);
            } catch (e) {
                console.error("Firebase load error:", e);
                renderLeaderboard([]);
            } finally {
                if (shouldShowLoading) {
                    leaderboardLoading.style.display = 'none';
                    leaderboardList.style.display = 'flex';
                    leaderboardRefreshTop.style.display = 'flex';
                    leaderboardControls.style.display = 'flex';
                    leaderboardUserRow.style.display = 'flex';
                    hasLoadedLeaderboardOnce = true;
                }
            }
        }

        // --- Локальное сохранение в Telegram CloudStorage ---
        async function loadLocalGame() {
            try {
                if (tg && tg.CloudStorage) {
                    const data = await new Promise((resolve, reject) => 
                        tg.CloudStorage.getItem('gameData', (err, value) => err ? reject(err) : resolve(value))
                    );
                    if (data) {
                        const parsed = typeof data === 'string' ? JSON.parse(data) : (typeof data === 'object' ? data : null);
                        if (parsed) {
                            gameState = { ...gameState, ...parsed };
                            if (parsed.settings) gameState.settings = { ...defaultSettings, ...parsed.settings };
                            gameState.settings.radioEnabled = 0;
                            clicks = gameState.score || 0;
                        }
                    }
                }
            } catch (e) {
                console.error('Local load error:', e);
            }
        }

        async function saveLocalGame() {
            gameState.score = clicks;
            const saveState = {
                ...gameState,
                settings: {
                    ...gameState.settings,
                    radioEnabled: 0
                }
            };
            try {
                if (tg && tg.CloudStorage) {
                    await new Promise((resolve, reject) => 
                        tg.CloudStorage.setItem('gameData', JSON.stringify(saveState), (err) => err ? reject(err) : resolve(true))
                    );
                }
            } catch (e) {
                console.error('Local save error:', e);
            }
        }

            const totalPages = Math.max(1, Math.ceil(players.length / 7));

            visiblePlayers.forEach((player, index) => {

                rankName.appendChild(name);

            const container = document.createElement("div");
            container.className = "boost-container";
            
            const spring = document.createElement("div");
            spring.className = "boost-spring spawning";
            
            const sway = document.createElement("div");

            sway.appendChild(img);
            spring.appendChild(sway);
            container.appendChild(spring);
            document.body.appendChild(container);
            
            playSound(buffers.bonus, 0.5);
            
            const boostSize = 150;
            const maxX = window.innerWidth - boostSize - 20;
            const maxY = window.innerHeight - boostSize - 20;
            container.style.left = Math.max(20, Math.random() * maxX) + "px";
            container.style.top = Math.max(20, Math.random() * maxY) + "px";
            
            let boostActivated = false;
            
            const activateBoost = e => {
                if (boostActivated) return;
                if (e && e.cancelable) e.preventDefault();
                e.stopPropagation();
                boostActivated = true;
                
                playSound(buffers.monster, 0.5);
                triggerHaptic('medium');
                clickMultiplier = 2;
                boostIndicators.classList.add("active");
                setAnimSpeed(4.4);
                
                spring.className = "boost-spring despawning";
                setTimeout(() => {
                    if (document.body.contains(container)) container.remove();
                }, 150);
                
                clearTimeout(boostTimeout);
                clearTimeout(multiplierTimeout);
                multiplierTimeout = setTimeout(() => {
                    clickMultiplier = 1;
                    boostIndicators.classList.remove("active");
                    setAnimSpeed(1);
                    scheduleNextBoost();
                }, 10000);
            };
            
            container.addEventListener("touchstart", activateBoost, { passive: false });
            container.addEventListener("mousedown", activateBoost);
            container.addEventListener("contextmenu", e => e.preventDefault());
            
            boostTimeout = setTimeout(() => {
                if (!boostActivated && document.body.contains(container)) {

                    setTimeout(() => {

                    }, 150);
                    setTimeout(() => scheduleNextBoost(), 150);

        });
        soundToggleBtn.addEventListener("contextmenu", e => e.preventDefault());

        attachReleaseAction(hardResetBtn, e => {
            triggerHaptic('light');
            playSound(buffers.click, 0.5);
            renderConfirmResetScore();
            playHardResetLoop();
            confirmResetModal.classList.add('active');
            pushModal('confirmReset');
        });
        hardResetBtn.addEventListener("contextmenu", e => e.preventDefault());

        attachReleaseAction(confirmResetBtn, async e => {
            triggerHaptic('medium');
            playSound(buffers.click, 0.5);
            stopHardResetLoop();
            
            clicks = 0;
            clickMultiplier = 1;
            gameState = { ...JSON.parse(JSON.stringify(defaultProgress)), settings: gameState.settings };
            
            updateCounterDisplay();
            
            try {
                if (tg && tg.CloudStorage) {
                    await new Promise((resolve, reject) => 
                        tg.CloudStorage.setItem('gameData', JSON.stringify(gameState), (err) => err ? reject(err) : resolve(true))
                    );
                }
                if (tgUserId) {
                    await set(ref(db, 'leaderboard/' + tgUserId), { name: userName, score: 0, lastUpdated: Date.now() });
                }
            } catch (err) {
                console.error("Hard reset error:", err);
            }
            
            confirmResetModal.classList.remove('active');
            closeModal();
            modalStack.length = 0;
            if (tg && tg.BackButton) tg.BackButton.hide();
        });
        confirmResetBtn.addEventListener("contextmenu", e => e.preventDefault());

        attachReleaseAction(cancelResetBtn, e => {
            triggerHaptic('light');
            playSound(buffers.click, 0.5);
            stopHardResetLoop();
            confirmResetModal.classList.remove('active');
            popModal();
        });
        cancelResetBtn.addEventListener("contextmenu", e => e.preventDefault());

        attachReleaseAction(leaderboardRefreshTop, async e => {
            triggerHaptic('light');
            playSound(buffers.click, 0.5);
            await updateFirebaseScore();
            loadLeaderboard();
        });
        leaderboardRefreshTop.addEventListener("contextmenu", e => e.preventDefault());

        function changeLeaderboardPage(delta) {
            if (!leaderboardPlayers.length) return;
            const totalPages = Math.max(1, Math.ceil(leaderboardPlayers.length / 7));
            leaderboardPage = Math.max(0, Math.min(totalPages - 1, leaderboardPage + delta));
            renderLeaderboard(leaderboardPlayers);
        }

        const handleLeaderboardNav = (delta) => (e) => {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            triggerHaptic('light');
            playSound(buffers.click, 0.5);
            changeLeaderboardPage(delta);
        };

        attachReleaseAction(leaderboardPrevBtn, e => {
            triggerHaptic('light');
            playSound(buffers.click, 0.5);
            changeLeaderboardPage(-1);
        });
        leaderboardPrevBtn.addEventListener("contextmenu", e => e.preventDefault());

        attachReleaseAction(leaderboardNextBtn, e => {
            triggerHaptic('light');
            playSound(buffers.click, 0.5);
            changeLeaderboardPage(1);
        });
        leaderboardNextBtn.addEventListener("contextmenu", e => e.preventDefault());

        applyPressAnimation('.ui-btn-wrapper');
        applyPressAnimation('.sound-toggle-wrapper');
        applyPressAnimation('.radio-btn');
        applyPressAnimation('.vol-btn-wrapper');
        applyPressAnimation('.action-btn');
        applyPressAnimation('.reset-btn-wrapper');
        applyPressAnimation('.modal-close-wrapper');
        applyPressAnimation('.leaderboard-nav-btn');
        applyPressAnimation('.leaderboard-refresh-top');
        applyPressAnimation('.leaderboard-nav-img');
        applyPressAnimation('.sound-toggle-img');
        applyPressAnimation('.radio-img');
        applyPressAnimation('.vol-btn-img');
        applyPressAnimation('.hard-reset-img');
        applyPressAnimation('.donate-img');

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                saveLocalGame();
                updateFirebaseScore();
            }
        });
        window.addEventListener('beforeunload', () => { saveLocalGame(); updateFirebaseScore(); });
        window.addEventListener('pagehide', () => { saveLocalGame(); updateFirebaseScore(); });

        async function preloadResources() {
            initAudioContext();
            await loadLocalGame();
            
            const imgPromises = imageUrls.map(url => new Promise(resolve => {
                let done = false;
                const finish = () => { if (!done) { done = true; resolve(); } };
                const img = new Image();
                img.addEventListener('load', finish, { once: true });
                img.addEventListener('error', finish, { once: true });
                img.src = url;
                setTimeout(finish, 3000);
            }));
            
            const soundPromises = Object.entries(soundUrls).map(async ([key, url]) => {
                try {
                    const r = await fetch(url);
                    buffers[key] = await audioCtx.decodeAudioData(await r.arrayBuffer());
                } catch (e) {}
            });
            
            await Promise.race([
                Promise.all([...imgPromises, ...soundPromises]),
                new Promise(resolve => setTimeout(resolve, 5000))
            ]);
            
            await loadLeaderboard();
            
            await new Promise(r => setTimeout(r, 300));
            loadingScreen.classList.add('hidden');
            gameContainer.classList.add('visible');
            
            initGame();
            initRadio();
        }

        function initGame() {
            for (let i = 0; i <= 9; i++) {
                const img = document.createElement("img");
                img.src = `https://raw.githubusercontent.com/wei9htlessness/FUMOCLICK/main/numbers/${i}.png`;
                img.className = "digit-img";
                assetCache.appendChild(img);
            }
            updateCounterDisplay();
            scheduleNextBoost();
            setInterval(() => { saveLocalGame(); updateFirebaseScore(); }, 10000);
        }

        preloadResources();
    </script>
</body>
</html>
